name: macOS launcher

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Launcher configuration
        type: choice
        options: [RelWithDebInfo, Release]
        default: RelWithDebInfo

permissions:
  contents: read

jobs:
  build:
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'RelWithDebInfo' }}
    runs-on: macos-15

    steps:
      - name: Check out holder-launcher
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE"

      - name: Build launcher and tests
        run: cmake --build build --parallel

      - name: Test macOS launcher components
        run: ctest --test-dir build --output-on-failure

      - name: Stage launcher artifact with provenance and symbols
        run: cmake --build build --target stage_artifact

      - name: Verify staged artifact checksums and inventory
        run: python3 scripts/artifact.py verify build/artifacts/${{ inputs.build_type || 'RelWithDebInfo' }}

      - name: Upload launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: holder-launcher-macos${{ inputs.build_type == 'Release' && '-release' || '' }}
          path: build/artifacts/${{ inputs.build_type || 'RelWithDebInfo' }}/
          if-no-files-found: error
          retention-days: 90
